<mat-sidenav-container class="app-shell">
  <mat-sidenav #snav [mode]="isSmall ? 'over' : 'side'" [opened]="!isSmall" class="sidebar">
    <div class="brand">
      <span class="brand-icon">🍴</span>
      <span>Restaurante</span>
    </div>
    
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <span class="nav-link-content"><mat-icon>dashboard</mat-icon><span>Panel</span></span>
      </a>
      <a mat-list-item routerLink="/tables" routerLinkActive="active">
        <span class="nav-link-content"><mat-icon>table_restaurant</mat-icon><span>Mesas</span></span>
      </a>
      <a mat-list-item routerLink="/menu-items" routerLinkActive="active">
        <span class="nav-link-content"><mat-icon>restaurant_menu</mat-icon><span>Productos</span></span>
      </a>
      <a mat-list-item routerLink="/orders" routerLinkActive="active">
        <span class="nav-link-content"><mat-icon>receipt_long</mat-icon><span>Pedidos</span></span>
      </a>
      <a mat-list-item routerLink="/cash-register" routerLinkActive="active">
        <span class="nav-link-content"><mat-icon>attach_money</mat-icon><span>Caja</span></span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content-container">
    <mat-toolbar class="topbar">
      <button mat-icon-button (click)="snav.toggle()" *ngIf="isSmall">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Sistema de gestión de restaurante</span>
    </mat-toolbar>
    
    <div class="content app-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
